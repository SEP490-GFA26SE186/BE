name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (lint + unit + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sw
          POSTGRES_PASSWORD: sw
          POSTGRES_DB: storyweaver_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sw"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Integration test chi chay khi co TEST_DATABASE_URL (tests/integration/_db.js).
      TEST_DATABASE_URL: postgresql://sw:sw@localhost:5432/storyweaver_test
      DATABASE_URL: postgresql://sw:sw@localhost:5432/storyweaver_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npm test

  ai:
    name: ai (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    env:
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - run: uv sync --group dev
      - run: uv run ruff check .
      - run: uv run pytest -q
