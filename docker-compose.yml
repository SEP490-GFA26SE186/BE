# =============================================================================
# StoryWeaver AI — backend (dev/prod-like)
#
# Supabase la DB dam may nen KHONG co container Postgres o day. Migration chay
# tu may dev len Supabase (`npm run db:migrate` trong api).
#
# Moi service khai bao TUONG MINH bien moi truong no duoc nhan, thay vi dung
# `env_file: .env` mot dong. Lam vay thi container `ai` se nhan luon
# DATABASE_URL va JWT_SECRET — pha bien "Python chi duoc dung Storage". Bang
# duoi day vua la cau hinh vua la tai lieu kien truc: doc la biet ai duoc lam gi.
# =============================================================================

name: storyweaver

services:
  redis:
    image: redis:7-alpine
    # appendonly: job dang cho trong queue khong mat khi restart Redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- HTTP API: khong duoc goi ai truc tiep ----------------------
  api:
    build:
      context: ./api
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?can DATABASE_URL trong .env o root}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL}}
      JWT_SECRET: ${JWT_SECRET:?can JWT_SECRET trong .env o root}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
      APP_URL: ${APP_URL:-http://localhost:3000}
      REDIS_URL: redis://redis:6379
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-StoryWeaver AI}
      # payOS (thu tien goi / truyen). PAYOS_PAYOUT_* chi khi chi ho dung kenh rieng.
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      PAYOS_PAYOUT_CLIENT_ID: ${PAYOS_PAYOUT_CLIENT_ID:-}
      PAYOS_PAYOUT_API_KEY: ${PAYOS_PAYOUT_API_KEY:-}
      PAYOS_PAYOUT_CHECKSUM_KEY: ${PAYOS_PAYOUT_CHECKSUM_KEY:-}
      # Ma hoa so tai khoan ngan hang nguoi ban (32 byte hex/base64). Production bat buoc; dev trong = suy tu JWT_SECRET.
      BANK_DATA_KEY: ${BANK_DATA_KEY:-}
      # Trang Web payOS tra nguoi dung ve (returnUrl / cancelUrl).
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      # Ky link xem anh / audio cho client (api/src/clients/assetUrl.js). Cung tai khoan + folder voi ai.
      # Khong can CLOUDINARY_API_KEY: link giao file chi ky bang secret.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-storyweaver}
      # Sinh noi dung (chu, anh, giong doc) van qua queue. Ngoai le duy nhat: phan tich loi ke
      # (POST /stories/analyze) goi ai/ dong bo, ngan, khong tru credit — nen api can URL + token.
      AI_SERVICE_URL: http://ai:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?can INTERNAL_TOKEN trong .env o root}
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ---- BullMQ worker: CUNG image voi api, khac command --------------------
  worker:
    build:
      context: ./api
    command: ["node", "src/worker.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?can DATABASE_URL trong .env o root}
      DIRECT_URL: ${DIRECT_URL:-${DATABASE_URL}}
      REDIS_URL: redis://redis:6379
      AI_SERVICE_URL: http://ai:8000
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?can INTERNAL_TOKEN trong .env o root}
      # Timeout goi ai/ theo job (ms). De trong = mac dinh JOB_CONFIG trong api/src/clients/aiClient.js
      # (320s story_text, 90s anh, 150s narration). Xem docs/contracts/ai-service.md §6.
      AI_TIMEOUT_MS_STORY_TEXT: ${AI_TIMEOUT_MS_STORY_TEXT:-}
      AI_TIMEOUT_MS_CHARACTER_PORTRAIT: ${AI_TIMEOUT_MS_CHARACTER_PORTRAIT:-}
      AI_TIMEOUT_MS_SCENE_IMAGE: ${AI_TIMEOUT_MS_SCENE_IMAGE:-}
      AI_TIMEOUT_MS_NARRATION: ${AI_TIMEOUT_MS_NARRATION:-}
      AI_JOB_ATTEMPTS: ${AI_JOB_ATTEMPTS:-3}
      AI_WORKER_CONCURRENCY: ${AI_WORKER_CONCURRENCY:-3}
      # CO Y khong co JWT_SECRET / BREVO_*: worker khong xu ly request cua user.
    healthcheck:
      # GHI DE healthcheck thua huong tu Dockerfile (curl :3000): worker khong
      # chay HTTP server nen check do khong bao gio pass. Worker song = ping
      # duoc Redis.
      test: ["CMD", "node", "src/healthcheck.worker.js"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
      ai:
        condition: service_healthy
    restart: unless-stopped

  # ---- AI inference: `expose` chu KHONG `ports` ---------------------------
  ai:
    build:
      context: ./ai
      args:
        # Cach nhau bang dau cach. tts = VieNeu-TTS (TTS_PROVIDER=vieneu); claude-code = claude-agent-sdk
        # kem san CLI (LLM_PROVIDER=claude_code). Doi xong phai `up --build ai`.
        AI_EXTRAS: ${AI_EXTRAS:-}
    environment:
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?can INTERNAL_TOKEN trong .env o root}
      # Chu (mock | gemini | claude | claude_code) va giong doc (mock | vieneu) chon rieng. Anh chi co mock.
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      TTS_PROVIDER: ${TTS_PROVIDER:-mock}
      # Chi khi TTS_PROVIDER=vieneu. De trong = mac dinh ai/app/config.py (Kim Thanh, fp32, 120 s, mp3).
      TTS_DEFAULT_VOICE: ${TTS_DEFAULT_VOICE:-}
      TTS_VIENEU_PRECISION: ${TTS_VIENEU_PRECISION:-}
      TTS_TIMEOUT_SECONDS: ${TTS_TIMEOUT_SECONDS:-}
      TTS_AUDIO_FORMAT: ${TTS_AUDIO_FORMAT:-}
      # Chi can khi LLM_PROVIDER=gemini; model phai ton tai (kiem luc khoi dong).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_TEXT_MODEL: ${GEMINI_TEXT_MODEL:-}
      # Chi khi LLM_PROVIDER=claude (Anthropic API). Trong container khong co profile
      # `ant auth login`, nen phai co ANTHROPIC_API_KEY.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Chi khi LLM_PROVIDER=claude_code (goi Pro/Max qua CLI, can AI_EXTRAS chua claude-code).
      # Lay bang `claude setup-token` tren may co trinh duyet. De trong thi ai/ xoa bien rong luc
      # khoi dong (CLI coi chuoi rong la key) — xem README "Claude".
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      LLM_CLAUDE_MODEL: ${LLM_CLAUDE_MODEL:-}
      LLM_CLAUDE_THINKING: ${LLM_CLAUDE_THINKING:-}
      LLM_CLAUDE_EFFORT: ${LLM_CLAUDE_EFFORT:-}
      # Tuy chon. De trong = mac dinh trong ai/app/config.py (Settings bo qua bien rong).
      # Bat bien: AI_TIMEOUT_MS_STORY_TEXT (worker) > 2 x LLM_TIMEOUT_SECONDS + overhead.
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-}
      LLM_RETRY_TEMPERATURE: ${LLM_RETRY_TEMPERATURE:-}
      LLM_THINKING_BUDGET: ${LLM_THINKING_BUDGET:-}
      LLM_TRUNCATION_RETRY_FACTOR: ${LLM_TRUNCATION_RETRY_FACTOR:-}
      TOKENS_PER_WORD: ${TOKENS_PER_WORD:-}
      SCENE_DESCRIPTION_MAX_WORDS: ${SCENE_DESCRIPTION_MAX_WORDS:-}
      IMAGE_PROFILE_PORTRAIT: ${IMAGE_PROFILE_PORTRAIT:-}
      IMAGE_PROFILE_SCENE: ${IMAGE_PROFILE_SCENE:-}
      # Profile that (cf-*) can ca hai bien CLOUDFLARE_* + IMAGE_SAFETY=human_review, khong thi ai/ khong khoi dong.
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      IMAGE_SAFETY: ${IMAGE_SAFETY:-}
      PRICE_TEXT_INPUT_PER_MTOK_MICROS: ${PRICE_TEXT_INPUT_PER_MTOK_MICROS:-}
      PRICE_TEXT_OUTPUT_PER_MTOK_MICROS: ${PRICE_TEXT_OUTPUT_PER_MTOK_MICROS:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      # Luu file: du 3 bien CLOUDINARY_* -> Cloudinary, khong thi Supabase, khong thi LocalStorage.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-storyweaver}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-story-assets}
      # CO Y khong co DATABASE_URL / REDIS_URL / JWT_SECRET: service nay khong duoc doc DB.
    volumes:
      # Model VieNeu (~580 MB) tai lan dau, giu qua cac lan tao lai container.
      - hf-cache:/home/appuser/.cache/huggingface
    expose:
      # Chi service trong network cua compose goi duoc. Khong ai tu host hay LAN
      # choc truc tiep vao endpoint sinh noi dung duoc.
      - "8000"
    restart: unless-stopped

volumes:
  redis-data:
  hf-cache:
