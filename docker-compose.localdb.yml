# =============================================================================
# DB LOCAL — Postgres chay trong Docker thay cho Supabase (chi dung luc dev).
#
# Ly do: qua pooler Supabase moi truy van mat ~600-900 ms, editor luu 3-19 s.
# Postgres cung may ~1 ms.
#
# Gop them vao lenh dev (thu tu file quan trong: file sau ghi de file truoc):
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.localdb.yml up
#
# hoac dat trong .env cua rieng ban (Windows dung ; — Linux/macOS dung :):
#
#   COMPOSE_FILE=docker-compose.yml;docker-compose.dev.yml;docker-compose.localdb.yml
#
# Lan dau (va moi khi co migration moi) tao bang + du lieu mau:
#
#   docker compose exec api npm run db:setup
#
# DATABASE_URL / DIRECT_URL trong .env o root BI GHI DE cho api + worker, nen
# .env van giu link Supabase cung duoc — bo file nay ra la quay lai Supabase.
# Du lieu nam o volume `pg-data`: `docker compose down -v` se XOA SACH (ca Redis).
# =============================================================================

x-local-db-url: &local-db-url postgresql://storyweaver:storyweaver@postgres:5432/storyweaver?schema=public

services:
  postgres:
    # Cung major voi Supabase (Postgres 15+); citext co san trong image nay.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: storyweaver
      POSTGRES_PASSWORD: storyweaver
      POSTGRES_DB: storyweaver
    ports:
      # Mo ra host de chay Prisma Studio / DBeaver / `npm run dev` ngoai Docker.
      # Trung cong voi Postgres cai san tren may thi doi: POSTGRES_HOST_PORT=5433
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyweaver -d storyweaver"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    environment:
      DATABASE_URL: *local-db-url
      DIRECT_URL: *local-db-url
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    environment:
      DATABASE_URL: *local-db-url
      DIRECT_URL: *local-db-url
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg-data:
